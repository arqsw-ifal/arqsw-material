site_name: "Arquitetura de Software: um voo do negócio ao código"
site_description: Material da disciplina Arquitetura de Software (BSI) - IFAL-Maceio
site_author: Leo Fernandes, PhD
site_url: https://arqsw-ifal.github.io/arqsw-material/
repo_url: https://github.com/arqsw-ifal/arqsw-material
repo_name: arqsw-ifal/arqsw-material
edit_uri: ""
copyright: Leo Fernandes, PhD &middot; IFAL-Maceio &middot; <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.pt-br">CC BY-NC-SA 4.0</a>

theme:
  name: material
  language: pt-BR
  font:
    text: Schibsted Grotesk
    code: JetBrains Mono
  icon:
    logo: material/airplane
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight

extra_css:
  - assets/css/extra.css

extra_javascript:
  - assets/js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - assets/js/mermaid-init.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: pt
  - glightbox

